name: Bug report
description: Something in a @snowbros package or the skill behaves incorrectly
labels: [bug]
body:
  - type: input
    id: package
    attributes:
      label: Package / area
      placeholder: "@snowbros/motion 0.1.0, or skills/snowbros-creative"
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: Code, a StackBlitz link, or steps. Include browser + OS.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
    validations:
      required: true
  - type: dropdown
    id: motion
    attributes:
      label: Reduced motion enabled?
      options: ["No", "Yes", "Not sure"]
